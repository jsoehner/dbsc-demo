name: "Security Governance & Automated Gates"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly security scan every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  # ============================================================================
  # 1. SECRET SCANNING: Prevent committed credentials and API keys
  # ============================================================================
  secret-scan:
    name: "Secret Leak Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # ============================================================================
  # 2. SAST SCANNING: Multi-language Static Application Security Testing
  # ============================================================================
  sast-scan:
    name: "Static Application Security Testing (SAST)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep SAST Analysis
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --sarif --output=/src/semgrep-results.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

  # ============================================================================
  # 3. DEPENDENCY & SUPPLY CHAIN: Vulnerability and CVE Auditing
  # ============================================================================
  dependency-scan:
    name: "Dependency & Supply Chain Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy Vulnerability Scanner (Filesystem / Dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-dependencies

  # ============================================================================
  # 4. ADR SECURITY GATEKEEPER: Ensure architectural security changes have ADRs
  # ============================================================================
  adr-gatekeeper:
    name: "ADR Security Gatekeeper"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Run ADR Security Gatekeeper
        env:
          ACTOR: ${{ github.actor }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ] || [[ "$ACTOR" == *"bot"* ]]; then
            echo "✅ Skipping ADR Gatekeeper check for automated bot actor: $ACTOR"
            exit 0
          fi
          if [ -f "scripts/adr_security_gatekeeper.py" ]; then
            python3 scripts/adr_security_gatekeeper.py --base "origin/$BASE_REF" --event "$EVENT_NAME" --actor "$ACTOR"
          else
            echo "Running inline fallback gatekeeper check..."
            SENSITIVE_PATHS="auth/ crypto/ security/ certs/ .github/workflows/ api/ policy/"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
            REQUIRES_ADR=false
            for path in $SENSITIVE_PATHS; do
              if echo "$CHANGED_FILES" | grep -E "^$path" > /dev/null; then
                echo "⚠️ Sensitive path modified: $path"
                REQUIRES_ADR=true
              fi
            done
            if [ "$REQUIRES_ADR" = true ]; then
              if echo "$CHANGED_FILES" | grep -E "^docs/adr/.*\.md$" > /dev/null; then
                echo "✅ Security ADR found in PR."
              else
                echo "❌ ERROR: Changes touch security-critical architecture ($SENSITIVE_PATHS), but no ADR was updated or added in docs/adr/."
                exit 1
              fi
            else
              echo "✅ No sensitive architecture paths modified. ADR not required."
            fi
          fi
